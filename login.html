<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login - ABC Coaching</title>

    <link rel="stylesheet" href="auth.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>

<body>

    <div class="auth-page">

        <div class="auth-container login-container">

            <!-- LEFT SIDE -->

            <div class="auth-left">

                <div class="brand">

                    <img src="logo.png" alt="H.A Coaching Logo">

                    <h1>H.A Coaching</h1>

                </div>

                <h2>Welcome Back!</h2>

                <p>
                    Login to access your student dashboard,
                    attendance, fees, results and course information.
                </p>

                <div class="features">

                    <div>
                        <i class="fa-solid fa-chart-pie"></i>
                        <span>Student Dashboard</span>
                    </div>

                    <div>
                        <i class="fa-solid fa-calendar-check"></i>
                        <span>Attendance Tracking</span>
                    </div>

                    <div>
                        <i class="fa-solid fa-file-invoice-dollar"></i>
                        <span>Fees Information</span>
                    </div>

                </div>

            </div>


            <!-- RIGHT SIDE -->

            <div class="auth-right login-right">

                <div class="form-header">

                    <div class="login-icon">

                        <i class="fa-solid fa-user"></i>

                    </div>

                    <h2>Welcome Back</h2>

                    <p>Login to your student account</p>

                </div>


                <form action="login.php" method="post">

                    <!-- Email -->

                    <div class="input-group">

                        <label>Email Address</label>

                        <div class="input-box">

                            <i class="fa-solid fa-envelope"></i>

                            <input
                                type="email"
                                name="email"
                                placeholder="Enter your email"
                                required>

                        </div>

                    </div>


                    <!-- Password -->

                    <div class="input-group">

                        <label>Password</label>

                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="loginPassword"
                                name="password"
                                placeholder="Enter your password"
                                required>

                            <i
                                class="fa-solid fa-eye password-eye"
                                onclick="togglePassword('loginPassword', this)">
                            </i>

                        </div>

                    </div>


                    <!-- Remember + Forgot -->

                    <div class="login-options">

                        <label>

                            <input type="checkbox">

                            Remember Me

                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <!-- Login Button -->

                    <button type="submit" class="auth-btn">

                        <i class="fa-solid fa-right-to-bracket"></i>

                        Login

                    </button>

                </form>


                <!-- Registration -->

                <div class="bottom-text">

                    Don't have an account?

                    <a href="register.html">
                        Register Now
                    </a>

                </div>


                <!-- Back Home -->

                <div class="back-home">

                    <a href="index.html">

                        <i class="fa-solid fa-arrow-left"></i>

                        Back to Home

                    </a>

                </div>

            </div>

        </div>

    </div>


    <script>

        function togglePassword(inputId, icon) {

            const input = document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";

                icon.classList.remove("fa-eye");

                icon.classList.add("fa-eye-slash");

            } else {

                input.type = "password";

                icon.classList.remove("fa-eye-slash");

                icon.classList.add("fa-eye");

            }

        }

    </script>

</body>

</html>
